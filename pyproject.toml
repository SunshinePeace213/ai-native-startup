[project]
name = "ai-native-startup"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-sugar>=1.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored from github.com/awesome-skills/code-review-skill. Formatting it would
# diverge the mirror from upstream; an agent editing one of its files still gets
# linted, since ruff checks explicitly-passed paths regardless of this list.
extend-exclude = [".claude/skills/code-review"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

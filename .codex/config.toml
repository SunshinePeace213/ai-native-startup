# Project-local Codex config: sandbox, approval policy, and hook layer for every Codex
# session in this repo, plus limits for the /harness-layer:harness-build review subagents
# defined in .codex/agents/*.toml.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[features]
hooks = true

[agents]
# These are the Codex defaults, pinned here explicitly because they already fit
# this design exactly: 6 review subagents, no nested spawning.
max_threads = 6
max_depth = 1

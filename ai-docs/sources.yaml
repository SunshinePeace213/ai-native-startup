# Knowledge-base manifest — managed by /kb.
#   group key: the folder under ai-docs/ (path-like keys nest, e.g. openai/codex)
#   url:     source page (canonicalized to the redirect target on sync)
#   file:    cached mirror under ai-docs/ (lives inside its group's folder)
#   topic:   one-line subject, reused by index.md
#   fetched: always null here — this file is the only tracked part of the KB, and a
#            real date would conflict every time a second device syncs. Each device's
#            own sync date lives in its mirror's `fetched:` frontmatter, which is
#            gitignored; /kb reads staleness from there. Never write a date back.

